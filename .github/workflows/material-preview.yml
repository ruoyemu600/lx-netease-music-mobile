name: Material UI Preview APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 不使用 android-actions/setup-android@v3：它会执行 `sdkmanager tools`，
      # 而 tools 包已从新版 SDK 仓库移除，固定失败于 "Failed to find package 'tools'"。
      # runner 已预装 SDK，但 cmdline-tools 不在 PATH 且未设置 ANDROID_HOME，这里显式定位。
      - name: Install Android SDK packages
        run: |
          set -e
          SDKM=$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$SDKM" ]; then
            echo "::error::找不到 sdkmanager"; ls -la "$ANDROID_HOME" || true; exit 1
          fi
          echo "sdkmanager = $SDKM"
          export PATH="$(dirname "$SDKM"):$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate themes and check patch formatting
        run: |
          npm run build:theme
          npm run check:ui
          node scripts/check-material-seek.cjs
          git diff --exit-code -- src/theme/themes/themes.ts
          git diff --check
      - name: Build standalone ARM64 preview
        working-directory: android
        env:
          DISABLE_SVG: '1'
        run: bash ./gradlew assembleMaterialPreview -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-n-material-preview-arm64
          path: android/app/build/outputs/apk/materialPreview/*.apk
          if-no-files-found: error
          retention-days: 14